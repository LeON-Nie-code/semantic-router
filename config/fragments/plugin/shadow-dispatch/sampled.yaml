plugin:
  type: shadow_dispatch
  configuration:
    enabled: true
    # Logical models with backends in providers.models; even one uses a list.
    models: [candidate-a, candidate-b]
    # Sample once for the whole request group, not once per candidate.
    sample_rate: 0.05
    execution:
      # Shared across requests for this recipe and decision.
      max_concurrency: 2
      # Pending request groups, not individual candidate calls.
      max_queue_size: 8
      # Per-group deadline includes queue wait and all candidate calls.
      timeout: 30s
    budget:
      # Actual HTTP calls per group; must cover all models. No retries.
      max_calls: 2
      # Group total, divided up front: 1 MiB per effective candidate here.
      max_response_bytes: 2097152
    capture:
      enabled: false
      # Group total, divided equally: 4096 bytes per candidate here.
      max_bytes: 8192
